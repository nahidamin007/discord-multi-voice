services:
  - type: web
    name: discord-multi-voice
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_PASSWORD
        value: admin123
      - key: AUTO_START
        value: "false"
      - key: CHANNEL_IDS
        value: ""
      - key: TOKENS
        value: ""
      - key: ENABLE_TUNNEL
        value: "false"
